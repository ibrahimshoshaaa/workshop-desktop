name: workshop_desktop
description: تطبيق سطح المكتب (ويندوز) لإدارة طاحون رويال هوم - نسخة محلية مستقلة مع نسخ احتياطي
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: 3.44.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  file_picker: ^8.1.2

  collection: ^1.18.0

  # قاعدة بيانات محلية (المصدر الأساسي للبيانات على الويندوز)
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # تنزيل الصور القديمة فقط عند طلب المستخدم أثناء النقل
  http: ^1.2.2

  # UI / Fonts
  intl: ^0.20.2

  # PDF / Excel export
  pdf: ^3.11.0
  printing: ^5.13.2
  excel: ^4.0.6

  # Utilities
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  archive: ^3.6.1
  crypto: ^3.0.6
  cryptography: ^2.7.0
  sqlite3: ^2.9.4

  # إشعارات محلية على ويندوز (تنبيهات التسليم والمديونيات) - نفس فكرة
  # نسخة الموبايل. ملحوظة: دعم ويندوز في المكتبة دي أحدث وأقل نضجًا من
  # دعم أندرويد، فكل استدعاء ليها هنا (زي نسخة الموبايل بالظبط) لازم
  # يفضل ملفوف في try/catch عشان أي مشكلة فيها متأثرش على حفظ البيانات
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.20.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/fonts/Cairo-Regular.ttf
    - assets/fonts/Cairo-Bold.ttf
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
