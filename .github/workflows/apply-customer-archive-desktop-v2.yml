name: Apply customer archive desktop v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Apply archive implementation
        shell: python
        run: |
          from pathlib import Path

          def edit(path, fn):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = fn(s)
              if n == s:
                  raise SystemExit(f'No change made to {path}; expected marker not found')
              p.write_text(n, encoding='utf-8')

          # ---------------- database.dart ----------------
          def db_edit(s):
              s = s.replace(
                  "  BoolColumn get dirty => boolean().withDefault(const Constant(true))();\n\n  @override\n  Set<Column> get primaryKey => {id};\n}\n\n/// جدول الطلبات",
                  "  BoolColumn get dirty => boolean().withDefault(const Constant(true))();\n  BoolColumn get isArchived => boolean().withDefault(const Constant(false))();\n  IntColumn get archivedAt => integer().nullable()();\n  IntColumn get archiveYear => integer().nullable()();\n\n  @override\n  Set<Column> get primaryKey => {id};\n}\n\n/// جدول الطلبات",
                  1)
              s = s.replace(
                  "  BoolColumn get dirty => boolean().withDefault(const Constant(true))();\n\n  @override\n  Set<Column> get primaryKey => {id};\n}\n\n/// جدول الدفعات",
                  "  BoolColumn get dirty => boolean().withDefault(const Constant(true))();\n  BoolColumn get isArchived => boolean().withDefault(const Constant(false))();\n  IntColumn get archivedAt => integer().nullable()();\n  IntColumn get archiveYear => integer().nullable()();\n\n  @override\n  Set<Column> get primaryKey => {id};\n}\n\n/// جدول الدفعات",
                  1)
              s = s.replace("  int get schemaVersion => 10;", "  int get schemaVersion => 11;")
              marker = "        if (from < 10) {\n          // ربط مديونية الورشة بالطلب اللي ولّدها (نسخة 10) - لحالة العميل\n          // اللي دفع أكتر من السعر النهائي بعد تعديله\n          await m.addColumn(workshopDebts, workshopDebts.orderId);\n        }"
              insert = marker + "\n        if (from < 11) {\n          await m.addColumn(customers, customers.isArchived);\n          await m.addColumn(customers, customers.archivedAt);\n          await m.addColumn(customers, customers.archiveYear);\n          await m.addColumn(orders, orders.isArchived);\n          await m.addColumn(orders, orders.archivedAt);\n          await m.addColumn(orders, orders.archiveYear);\n        }"
              if marker not in s:
                  raise SystemExit('database migration marker not found')
              s = s.replace(marker, insert, 1)
              old = "  Stream<List<Customer>> watchCustomers() {\n    return (select(customers)..where((t) => t.isDeleted.equals(false))).watch();\n  }"
              new = "  Stream<List<Customer>> watchCustomers() {\n    return (select(customers)..where((t) => t.isDeleted.equals(false) & t.isArchived.equals(false))).watch();\n  }\n\n  Stream<List<Customer>> watchArchivedCustomers() {\n    return (select(customers)..where((t) => t.isDeleted.equals(false) & t.isArchived.equals(true))).watch();\n  }\n\n  Future<Customer?> getCustomer(String id) async {\n    return (select(customers)..where((t) => t.id.equals(id) & t.isDeleted.equals(false))).getSingleOrNull();\n  }"
              if old not in s:
                  raise SystemExit('watchCustomers marker not found')
              s = s.replace(old, new, 1)
              s = s.replace(
                  "  Stream<List<Order>> watchOrders() {\n    return (select(orders)..where((t) => t.isDeleted.equals(false))).watch();\n  }",
                  "  Stream<List<Order>> watchOrders() {\n    return (select(orders)..where((t) => t.isDeleted.equals(false) & t.isArchived.equals(false))).watch();\n  }\n\n  Stream<List<Order>> watchArchivedOrders({String? customerId, int? year}) {\n    final q = select(orders)..where((t) => t.isDeleted.equals(false) & t.isArchived.equals(true));\n    if (customerId != null) q.where((t) => t.customerId.equals(customerId));\n    if (year != null) q.where((t) => t.archiveYear.equals(year));\n    return q.watch();\n  }",
                  1)
              return s

          edit('lib/data/database.dart', db_edit)

          # ---------------- local_repository.dart ----------------
          def repo_edit(s):
              s = s.replace(
                  "      isDeleted: const Value(false),\n      dirty: const Value(true),\n    ));\n  }\n\n  Future<void> updateCustomer",
                  "      isDeleted: const Value(false),\n      dirty: const Value(true),\n      isArchived: const Value(false),\n    ));\n  }\n\n  Future<void> updateCustomer",
                  1)
              s = s.replace(
                  "      isDeleted: const Value(false),\n      dirty: const Value(true),\n    ));\n  }\n\n  Future<void> deleteCustomer(String id) => _db.softDeleteCustomer(id);",
                  "      isDeleted: const Value(false),\n      dirty: const Value(true),\n      isArchived: const Value(false),\n      archivedAt: const Value(null),\n      archiveYear: const Value(null),\n    ));\n  }\n\n  Future<void> deleteCustomer(String id) => _db.softDeleteCustomer(id);\n\n  Future<String?> archiveCustomer(String customerId) async {\n    final customer = await _db.getCustomer(customerId);\n    if (customer == null) return 'العميل غير موجود';\n    if (customer.isArchived) return null;\n    final orders = await (_db.select(_db.orders)..where((t) => t.customerId.equals(customerId) & t.isDeleted.equals(false))).get();\n    final blocked = orders.where((o) => o.remaining > 0.01 || o.status != 'تم التسليم').toList();\n    if (blocked.isNotEmpty) {\n      return 'لا يمكن الأرشفة: يوجد طلب غير مُسلّم أو عليه مبلغ متبقي';\n    }\n    final now = _now;\n    final year = DateTime.fromMillisecondsSinceEpoch(now).year;\n    await _db.transaction(() async {\n      await _db.updateCustomerFields(CustomersCompanion(\n        id: Value(customerId), isArchived: const Value(true), archivedAt: Value(now), archiveYear: Value(year),\n        updatedAt: Value(now), dirty: const Value(true),\n      ));\n      for (final order in orders) {\n        await _db.updateOrderFields(OrdersCompanion(\n          id: Value(order.id), isArchived: const Value(true), archivedAt: Value(now), archiveYear: Value(year),\n          updatedAt: Value(now), dirty: const Value(true),\n        ));\n      }\n    });\n    return null;\n  }\n\n  Future<String?> reactivateCustomer(String customerId) async {\n    final customer = await _db.getCustomer(customerId);\n    if (customer == null) return 'العميل غير موجود';\n    if (!customer.isArchived) return null;\n    await _db.updateCustomerFields(CustomersCompanion(\n      id: Value(customer.id), isArchived: const Value(false), archivedAt: const Value(null), archiveYear: const Value(null),\n      updatedAt: Value(_now), dirty: const Value(true),\n    ));\n    return null;\n  }",
                  1)
              return s
          edit('lib/data/local_repository.dart', repo_edit)

          # ---------------- data_providers.dart ----------------
          def providers_edit(s):
              marker = "final customersProvider = StreamProvider<List<Customer>>((ref) {\n  return ref.watch(databaseProvider).watchCustomers();\n});"
              repl = marker + "\n\nfinal archivedCustomersProvider = StreamProvider<List<Customer>>((ref) {\n  return ref.watch(databaseProvider).watchArchivedCustomers();\n});\n\nfinal archivedOrdersProvider = StreamProvider.family<List<Order>, String>((ref, customerId) {\n  return ref.watch(databaseProvider).watchArchivedOrders(customerId: customerId);\n});"
              if marker not in s:
                  raise SystemExit('customers provider marker not found')
              return s.replace(marker, repl, 1)
          edit('lib/providers/data_providers.dart', providers_edit)

          # ---------------- firebase sync ----------------
          def sync_edit(s):
              cust_remote = "            createdAt: Value((map['createdAt'] as num?)?.toInt() ?? remoteUpdatedAt),\n            updatedAt: Value(remoteUpdatedAt),\n            isDeleted: const Value(false),\n            dirty: const Value(false),"
              cust_new = "            createdAt: Value((map['createdAt'] as num?)?.toInt() ?? remoteUpdatedAt),\n            updatedAt: Value(remoteUpdatedAt),\n            isDeleted: const Value(false),\n            isArchived: Value(map['isArchived'] == true),\n            archivedAt: Value((map['archivedAt'] as num?)?.toInt()),\n            archiveYear: Value((map['archiveYear'] as num?)?.toInt()),\n            dirty: const Value(false),"
              if cust_remote not in s:
                  raise SystemExit('sync customer remote marker not found')
              s = s.replace(cust_remote, cust_new, 1)
              cust_put = "          'serialNumber': row.serialNumber,\n          'createdAt': row.createdAt,\n          'updatedAt': row.updatedAt,"
              cust_put_new = "          'serialNumber': row.serialNumber,\n          'createdAt': row.createdAt,\n          'updatedAt': row.updatedAt,\n          'isArchived': row.isArchived,\n          'archivedAt': row.archivedAt,\n          'archiveYear': row.archiveYear,"
              if cust_put not in s:
                  raise SystemExit('sync customer put marker not found')
              s = s.replace(cust_put, cust_put_new, 1)
              order_remote = "            createdAt: Value((map['createdAt'] as num?)?.toInt() ?? remoteUpdatedAt),\n            updatedAt: Value(remoteUpdatedAt),\n            isDeleted: const Value(false),\n            dirty: const Value(false),"
              order_new = "            createdAt: Value((map['createdAt'] as num?)?.toInt() ?? remoteUpdatedAt),\n            updatedAt: Value(remoteUpdatedAt),\n            isDeleted: const Value(false),\n            isArchived: Value(map['isArchived'] == true),\n            archivedAt: Value((map['archivedAt'] as num?)?.toInt()),\n            archiveYear: Value((map['archiveYear'] as num?)?.toInt()),\n            dirty: const Value(false),"
              if order_remote not in s:
                  raise SystemExit('sync order remote marker not found')
              s = s.replace(order_remote, order_new, 1)
              order_put = "          'createdAt': row.createdAt,\n          'updatedAt': row.updatedAt,"
              order_put_new = "          'createdAt': row.createdAt,\n          'updatedAt': row.updatedAt,\n          'isArchived': row.isArchived,\n          'archivedAt': row.archivedAt,\n          'archiveYear': row.archiveYear,"
              if order_put not in s:
                  raise SystemExit('sync order put marker not found')
              s = s.replace(order_put, order_put_new, 1)
              return s
          edit('lib/services/sync_service.dart', sync_edit)

          # ---------------- app shell ----------------
          def shell_edit(s):
              s = s.replace("import 'customers_screen.dart';", "import 'customers_screen.dart';\nimport 'customer_archive_screen.dart';", 1)
              old = "    (Icons.people_alt_rounded, 'العملاء', 'customers'),\n    (Icons.checkroom_rounded, 'الطلبات', 'orders'),"
              new = "    (Icons.people_alt_rounded, 'العملاء', 'customers'),\n    (Icons.archive_rounded, 'أرشيف العملاء', 'admin_only'),\n    (Icons.checkroom_rounded, 'الطلبات', 'orders'),"
              if old not in s:
                  raise SystemExit('shell destinations marker not found')
              s = s.replace(old, new, 1)
              old2 = "    const CustomersScreen(),\n    const OrdersScreen(),"
              new2 = "    const CustomersScreen(),\n    const CustomerArchiveScreen(),\n    const OrdersScreen(),"
              if old2 not in s:
                  raise SystemExit('shell screens marker not found')
              return s.replace(old2, new2, 1)
          edit('lib/screens/app_shell.dart', shell_edit)

          # ---------------- customers screen ----------------
          def customers_edit(s):
              s = s.replace("import '../providers/data_providers.dart';", "import '../providers/data_providers.dart';\nimport '../providers/auth_provider.dart';", 1)
              old = "    final customersAsync = ref.watch(customersProvider);\n\n    return Container("
              new = "    final customersAsync = ref.watch(customersProvider);\n    final archivedAsync = ref.watch(archivedCustomersProvider);\n    final isAdmin = ref.watch(sessionProvider).value?.isAdmin ?? false;\n\n    return Container("
              if old not in s:
                  raise SystemExit('customers async marker not found')
              s = s.replace(old, new, 1)
              old2 = "              data: (customers) {\n                if (customers.isEmpty) {\n                  return const _EmptyState(icon: Icons.people_outline_rounded, text: 'لا يوجد عملاء بعد');\n                }\n                final q = normalizeForSearch(_query);\n                final filtered = q.isEmpty\n                    ? customers\n                    : customers.where((c) {"
              new2 = "              data: (customers) {\n                final archived = archivedAsync.value ?? [];\n                final allForSearch = [...customers, ...archived];\n                if (allForSearch.isEmpty) {\n                  return const _EmptyState(icon: Icons.people_outline_rounded, text: 'لا يوجد عملاء بعد');\n                }\n                final q = normalizeForSearch(_query);\n                final filtered = (q.isEmpty ? customers : allForSearch).where((c) {"
              if old2 not in s:
                  raise SystemExit('customers filtering marker not found')
              s = s.replace(old2, new2, 1)
              s = s.replace(
                  "                        onTap: () => showDialog(context: context, builder: (context) => CustomerOrdersDialog(customer: c)),\n                        onEdit: () => _showCustomerDialog(context, ref, customer: c),\n                        onDelete: () async {",
                  "                        onTap: () => showDialog(context: context, builder: (context) => CustomerOrdersDialog(customer: c)),\n                        onEdit: () => _showCustomerDialog(context, ref, customer: c),\n                        onReactivate: c.isArchived ? () async {\n                          if (!isAdmin) return;\n                          final error = await ref.read(repositoryProvider).reactivateCustomer(c.id);\n                          if (error != null && context.mounted) {\n                            ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(error)));\n                          }\n                        } : null,\n                        onArchive: (!c.isArchived && isAdmin) ? () async {\n                          final error = await ref.read(repositoryProvider).archiveCustomer(c.id);\n                          if (context.mounted) {\n                            ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(error ?? 'تم أرشفة العميل وطلباته بنجاح')));\n                          }\n                        } : null,\n                        onDelete: () async {",
                  1)
              s = s.replace(
                  "  final VoidCallback onDelete;\n  const _CustomerRow({required this.customer, required this.onTap, required this.onEdit, required this.onDelete});",
                  "  final VoidCallback onDelete;\n  final VoidCallback? onReactivate;\n  final VoidCallback? onArchive;\n  const _CustomerRow({required this.customer, required this.onTap, required this.onEdit, required this.onDelete, this.onReactivate, this.onArchive});",
                  1)
              badge = """                      if (c.isArchived) ...[\n                        const SizedBox(width: 8),\n                        Container(\n                          padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 3),\n                          decoration: BoxDecoration(color: Colors.blueGrey.withValues(alpha: 0.12), borderRadius: BorderRadius.circular(20)),\n                          child: Text('مؤرشف ${c.archiveYear ?? ''}', style: const TextStyle(fontSize: 10.5, color: Colors.blueGrey, fontWeight: FontWeight.bold)),\n                        ),\n                      ],"""
              needle = "                      ),\n                      const SizedBox(width: 8),\n                      Container(\n                        padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 3),"
              if needle not in s:
                  raise SystemExit('customer row badge marker not found')
              s = s.replace(needle, "                      ),\n" + badge + "                      const SizedBox(width: 8),\n                      Container(\n                        padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 3),", 1)
              buttons = """            if (c.isArchived && onReactivate != null)\n              IconButton(tooltip: 'إعادة تنشيط', icon: const Icon(Icons.unarchive_outlined, size: 20, color: AppColors.success), onPressed: onReactivate),\n            if (!c.isArchived && onArchive != null)\n              IconButton(tooltip: 'أرشفة', icon: const Icon(Icons.archive_outlined, size: 20, color: AppColors.wood), onPressed: onArchive),\n"""
              needle2 = "            IconButton(\n              tooltip: 'تعديل',"
              if needle2 not in s:
                  raise SystemExit('customer row buttons marker not found')
              s = s.replace(needle2, buttons + needle2, 1)
              return s
          edit('lib/screens/customers_screen.dart', customers_edit)

          # ---------------- archive screen ----------------
          Path('lib/screens/customer_archive_screen.dart').write_text(r'''import 'package:flutter/material.dart';
import 'package:flutter_riverpod/flutter_riverpod.dart';
import 'package:google_fonts/google_fonts.dart';
import 'package:intl/intl.dart' hide TextDirection;
import '../core/theme.dart';
import '../core/order_calculations.dart';
import '../data/database.dart';
import '../providers/data_providers.dart';
import '../providers/auth_provider.dart';

class CustomerArchiveScreen extends ConsumerStatefulWidget {
  const CustomerArchiveScreen({super.key});
  @override
  ConsumerState<CustomerArchiveScreen> createState() => _CustomerArchiveScreenState();
}

class _CustomerArchiveScreenState extends ConsumerState<CustomerArchiveScreen> {
  final _search = TextEditingController();
  String _query = '';
  int? _year;

  @override
  void dispose() { _search.dispose(); super.dispose(); }

  @override
  Widget build(BuildContext context) {
    final customersAsync = ref.watch(archivedCustomersProvider);
    final isAdmin = ref.watch(sessionProvider).value?.isAdmin ?? false;
    return Container(
      color: const Color(0xFFFAF6F0),
      child: Column(crossAxisAlignment: CrossAxisAlignment.stretch, children: [
        Padding(padding: const EdgeInsets.fromLTRB(28, 28, 28, 0), child: Row(children: [
          Container(padding: const EdgeInsets.all(12), decoration: BoxDecoration(color: AppColors.wood.withValues(alpha: .1), borderRadius: BorderRadius.circular(14)), child: const Icon(Icons.archive_rounded, color: AppColors.wood)),
          const SizedBox(width: 14),
          Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
            Text('أرشيف العملاء', style: GoogleFonts.cairo(fontSize: 22, fontWeight: FontWeight.w800, color: const Color(0xFF2A2320))),
            Text('تاريخ العملاء والطلبات المؤرشفة بدون حذف البيانات', style: GoogleFonts.cairo(fontSize: 13, color: Colors.grey.shade600)),
          ])),
        ])),
        Padding(padding: const EdgeInsets.fromLTRB(28, 20, 28, 0), child: TextField(
          controller: _search,
          onChanged: (v) => setState(() => _query = v),
          decoration: InputDecoration(prefixIcon: const Icon(Icons.search), hintText: 'ابحث بالاسم أو الهاتف أو الرقم التسلسلي...', filled: true, fillColor: Colors.white, border: OutlineInputBorder(borderRadius: BorderRadius.circular(14), borderSide: BorderSide.none)),
        )),
        Expanded(child: customersAsync.when(
          loading: () => const Center(child: CircularProgressIndicator()),
          error: (e, _) => Center(child: Text('خطأ: $e')),
          data: (customers) {
            final years = customers.map((c) => c.archiveYear).whereType<int>().toSet().toList()..sort((a,b) => b.compareTo(a));
            final q = normalizeForSearch(_query);
            final filtered = customers.where((c) {
              final text = normalizeForSearch('${c.name} ${c.phone} ${c.serialNumber}');
              return (q.isEmpty || text.contains(q)) && (_year == null || c.archiveYear == _year);
            }).toList();
            return Column(children: [
              if (years.isNotEmpty) SizedBox(height: 56, child: ListView(scrollDirection: Axis.horizontal, padding: const EdgeInsets.symmetric(horizontal: 28, vertical: 10), children: [
                ChoiceChip(label: const Text('كل السنوات'), selected: _year == null, onSelected: (_) => setState(() => _year = null)),
                const SizedBox(width: 8),
                ...years.map((y) => Padding(padding: const EdgeInsets.only(right: 8), child: ChoiceChip(label: Text('أرشيف $y'), selected: _year == y, onSelected: (_) => setState(() => _year = y)))),
              ])),
              Expanded(child: filtered.isEmpty ? const Center(child: Text('لا توجد نتائج في الأرشيف')) : ListView.builder(
                padding: const EdgeInsets.fromLTRB(28, 8, 28, 24), itemCount: filtered.length,
                itemBuilder: (context, i) => _ArchiveCustomerCard(customer: filtered[i], isAdmin: isAdmin),
              )),
            ]);
          },
        )),
      ]),
    );
  }
}

class _ArchiveCustomerCard extends ConsumerWidget {
  final Customer customer;
  final bool isAdmin;
  const _ArchiveCustomerCard({required this.customer, required this.isAdmin});

  @override
  Widget build(BuildContext context, WidgetRef ref) {
    final ordersAsync = ref.watch(archivedOrdersProvider(customer.id));
    final orders = ordersAsync.value ?? [];
    final total = orders.fold<double>(0, (s, o) => s + o.totalAmount);
    return Card(margin: const EdgeInsets.only(bottom: 12), elevation: 0, shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)), child: ExpansionTile(
      leading: CircleAvatar(backgroundColor: AppColors.wood.withValues(alpha: .1), child: Text(customer.name.isNotEmpty ? customer.name[0] : '?', style: const TextStyle(color: AppColors.wood))),
      title: Row(children: [Expanded(child: Text(customer.name, style: GoogleFonts.cairo(fontWeight: FontWeight.w800))), Text('#${customer.serialNumber}', style: const TextStyle(color: AppColors.wood, fontWeight: FontWeight.bold))]),
      subtitle: Text('${customer.phone} • ${orders.length} طلب • إجمالي ${total.toStringAsFixed(0)}', style: GoogleFonts.cairo(fontSize: 11.5)),
      children: [
        ...orders.map((o) => ListTile(
          title: Text(o.itemType, style: GoogleFonts.cairo(fontWeight: FontWeight.w700)),
          subtitle: Text('التسليم ${DateFormat('d/M/yyyy').format(DateTime.fromMillisecondsSinceEpoch(o.deliveryDate))} • ${o.status} • ${o.totalAmount.toStringAsFixed(0)}'),
          trailing: Text(o.remaining > .01 ? 'متبقي ${o.remaining.toStringAsFixed(0)}' : 'مكتمل', style: TextStyle(color: o.remaining > .01 ? AppColors.danger : AppColors.success, fontWeight: FontWeight.bold)),
        )),
        if (isAdmin) Padding(padding: const EdgeInsets.fromLTRB(16, 0, 16, 14), child: Align(alignment: AlignmentDirectional.centerEnd, child: FilledButton.icon(
          onPressed: () async {
            final error = await ref.read(repositoryProvider).reactivateCustomer(customer.id);
            if (context.mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(error ?? 'تم إعادة تنشيط العميل')));
          }, icon: const Icon(Icons.unarchive_outlined), label: const Text('إعادة تنشيط العميل'),
        ))),
      ],
    ));
  }
}
''', encoding='utf-8')

          # ---------------- generated code will be rebuilt ----------------

      - name: Fetch dependencies and regenerate Drift code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib .github/workflows/apply-customer-archive-desktop-v2.yml
          git diff --cached --quiet || git commit -m "Implement professional customer archive on desktop"
          git push
