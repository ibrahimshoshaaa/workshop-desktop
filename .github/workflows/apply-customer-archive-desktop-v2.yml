name: Apply customer archive desktop v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Apply archive implementation
        shell: python
        run: |
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path); s = p.read_text(encoding='utf-8'); n = fn(s)
              if n == s: raise SystemExit(f'No change made to {path}')
              p.write_text(n, encoding='utf-8')

          def once(s, old, new, label):
              if old not in s: raise SystemExit(f'Marker not found: {label}')
              return s.replace(old, new, 1)

          def db(s):
              s = once(s,
                "  BoolColumn get dirty => boolean().withDefault(const Constant(true))();\n\n  @override\n  Set<Column> get primaryKey => {id};\n}\n\n/// جدول الطلبات",
                "  BoolColumn get dirty => boolean().withDefault(const Constant(true))();\n  BoolColumn get isArchived => boolean().withDefault(const Constant(false))();\n  IntColumn get archivedAt => integer().nullable()();\n  IntColumn get archiveYear => integer().nullable()();\n\n  @override\n  Set<Column> get primaryKey => {id};\n}\n\n/// جدول الطلبات", 'customer archive columns')
              s = once(s,
                "  BoolColumn get dirty => boolean().withDefault(const Constant(true))();\n\n  @override\n  Set<Column> get primaryKey => {id};\n}\n\n/// جدول الدفعات",
                "  BoolColumn get dirty => boolean().withDefault(const Constant(true))();\n  BoolColumn get isArchived => boolean().withDefault(const Constant(false))();\n  IntColumn get archivedAt => integer().nullable()();\n  IntColumn get archiveYear => integer().nullable()();\n\n  @override\n  Set<Column> get primaryKey => {id};\n}\n\n/// جدول الدفعات", 'order archive columns')
              s = s.replace('int get schemaVersion => 10;', 'int get schemaVersion => 11;', 1)
              marker = "        if (from < 10) {"
              pos = s.find(marker)
              if pos < 0: raise SystemExit('migration marker not found')
              close = s.find('\n        }', pos) + len('\n        }')
              block = s[pos:close]
              if 'workshopDebts.orderId' not in block: raise SystemExit('migration block mismatch')
              if 'from < 11' not in s:
                  s = s[:close] + "\n        if (from < 11) {\n          await m.addColumn(customers, customers.isArchived);\n          await m.addColumn(customers, customers.archivedAt);\n          await m.addColumn(customers, customers.archiveYear);\n          await m.addColumn(orders, orders.isArchived);\n          await m.addColumn(orders, orders.archivedAt);\n          await m.addColumn(orders, orders.archiveYear);\n        }" + s[close:]
              s = once(s,
                "  Stream<List<Customer>> watchCustomers() {\n    return (select(customers)..where((t) => t.isDeleted.equals(false))).watch();\n  }",
                "  Stream<List<Customer>> watchCustomers() {\n    return (select(customers)..where((t) => t.isDeleted.equals(false) & t.isArchived.equals(false))).watch();\n  }\n\n  Stream<List<Customer>> watchArchivedCustomers() {\n    return (select(customers)..where((t) => t.isDeleted.equals(false) & t.isArchived.equals(true))).watch();\n  }\n\n  Future<Customer?> getCustomer(String id) async {\n    return (select(customers)..where((t) => t.id.equals(id) & t.isDeleted.equals(false))).getSingleOrNull();\n  }", 'customer watches')
              s = once(s,
                "  Stream<List<Order>> watchOrders() {\n    return (select(orders)..where((t) => t.isDeleted.equals(false))).watch();\n  }",
                "  Stream<List<Order>> watchOrders() {\n    return (select(orders)..where((t) => t.isDeleted.equals(false) & t.isArchived.equals(false))).watch();\n  }\n\n  Stream<List<Order>> watchArchivedOrders({String? customerId, int? year}) {\n    final q = select(orders)..where((t) => t.isDeleted.equals(false) & t.isArchived.equals(true));\n    if (customerId != null) q.where((t) => t.customerId.equals(customerId));\n    if (year != null) q.where((t) => t.archiveYear.equals(year));\n    return q.watch();\n  }", 'order watches')
              return s
          edit('lib/data/database.dart', db)

          def repo(s):
              s = s.replace('      dirty: const Value(true),\n    ));\n  }\n\n  Future<void> updateCustomer', '      dirty: const Value(true),\n      isArchived: const Value(false),\n    ));\n  }\n\n  Future<void> updateCustomer', 1)
              marker = '  Future<void> deleteCustomer(String id) => _db.softDeleteCustomer(id);'
              if marker not in s: raise SystemExit('deleteCustomer marker not found')
              methods = '''  Future<String?> archiveCustomer(String customerId) async {
    final customer = await _db.getCustomer(customerId);
    if (customer == null) return 'العميل غير موجود';
    if (customer.isArchived) return null;
    final orders = await (_db.select(_db.orders)..where((t) => t.customerId.equals(customerId) & t.isDeleted.equals(false))).get();
    final blocked = orders.where((o) => o.remaining > 0.01 || o.status != 'تم التسليم').toList();
    if (blocked.isNotEmpty) return 'لا يمكن الأرشفة: يوجد طلب غير مُسلّم أو عليه مبلغ متبقي';
    final now = _now;
    final year = DateTime.fromMillisecondsSinceEpoch(now).year;
    await _db.transaction(() async {
      await _db.updateCustomerFields(CustomersCompanion(id: Value(customerId), isArchived: const Value(true), archivedAt: Value(now), archiveYear: Value(year), updatedAt: Value(now), dirty: const Value(true)));
      for (final o in orders) {
        await _db.updateOrderFields(OrdersCompanion(id: Value(o.id), isArchived: const Value(true), archivedAt: Value(now), archiveYear: Value(year), updatedAt: Value(now), dirty: const Value(true)));
      }
    });
    return null;
  }

  Future<String?> reactivateCustomer(String customerId) async {
    final customer = await _db.getCustomer(customerId);
    if (customer == null) return 'العميل غير موجود';
    if (!customer.isArchived) return null;
    await _db.updateCustomerFields(CustomersCompanion(id: Value(customerId), isArchived: const Value(false), archivedAt: const Value(null), archiveYear: const Value(null), updatedAt: Value(_now), dirty: const Value(true)));
    return null;
  }
'''
              s = s.replace(marker, marker + '\n\n' + methods, 1)
              return s
          edit('lib/data/local_repository.dart', repo)

          def providers(s):
              marker = "final customersProvider = StreamProvider<List<Customer>>((ref) {\n  return ref.watch(databaseProvider).watchCustomers();\n});"
              add = marker + "\n\nfinal archivedCustomersProvider = StreamProvider<List<Customer>>((ref) => ref.watch(databaseProvider).watchArchivedCustomers());\n\nfinal archivedOrdersProvider = StreamProvider.family<List<Order>, String>((ref, id) => ref.watch(databaseProvider).watchArchivedOrders(customerId: id));"
              return once(s, marker, add, 'providers')
          edit('lib/providers/data_providers.dart', providers)

          def sync(s):
              s = s.replace("            isDeleted: const Value(false),\n            dirty: const Value(false),", "            isDeleted: const Value(false),\n            isArchived: Value(map['isArchived'] == true),\n            archivedAt: Value((map['archivedAt'] as num?)?.toInt()),\n            archiveYear: Value((map['archiveYear'] as num?)?.toInt()),\n            dirty: const Value(false),", 2)
              s = s.replace("          'updatedAt': row.updatedAt,", "          'updatedAt': row.updatedAt,\n          'isArchived': row.isArchived,\n          'archivedAt': row.archivedAt,\n          'archiveYear': row.archiveYear,", 2)
              return s
          edit('lib/services/sync_service.dart', sync)

          def shell(s):
              s = once(s, "import 'customers_screen.dart';", "import 'customers_screen.dart';\nimport 'customer_archive_screen.dart';", 'archive import')
              s = once(s, "    (Icons.people_alt_rounded, 'العملاء', 'customers'),", "    (Icons.people_alt_rounded, 'العملاء', 'customers'),\n    (Icons.archive_rounded, 'أرشيف العملاء', 'admin_only'),", 'archive destination')
              return once(s, '    const CustomersScreen(),\n', '    const CustomersScreen(),\n    const CustomerArchiveScreen(),\n', 'archive screen')
          edit('lib/screens/app_shell.dart', shell)

          Path('lib/screens/customer_archive_screen.dart').write_text('''import 'package:flutter/material.dart';
import 'package:flutter_riverpod/flutter_riverpod.dart';
import 'package:google_fonts/google_fonts.dart';
import 'package:intl/intl.dart';
import '../core/theme.dart';
import '../data/database.dart';
import '../providers/data_providers.dart';
import '../providers/auth_provider.dart';

String normalizeForSearch(String value) => value.trim().toLowerCase();

class CustomerArchiveScreen extends ConsumerStatefulWidget {
  const CustomerArchiveScreen({super.key});
  @override ConsumerState<CustomerArchiveScreen> createState() => _CustomerArchiveScreenState();
}
class _CustomerArchiveScreenState extends ConsumerState<CustomerArchiveScreen> {
  final search = TextEditingController(); String query = ''; int? year;
  @override void dispose(){ search.dispose(); super.dispose(); }
  @override Widget build(BuildContext context) {
    final data = ref.watch(archivedCustomersProvider); final admin = ref.watch(sessionProvider).value?.isAdmin ?? false;
    return Container(color: const Color(0xFFFAF6F0), child: Column(children: [
      Padding(padding: const EdgeInsets.fromLTRB(28,28,28,12), child: Row(children:[const Icon(Icons.archive_rounded,color: AppColors.wood,size:30),const SizedBox(width:12),Text('أرشيف العملاء',style:GoogleFonts.cairo(fontSize:22,fontWeight:FontWeight.w800))])),
      Padding(padding: const EdgeInsets.symmetric(horizontal:28), child: TextField(controller:search,onChanged:(v)=>setState(()=>query=v),decoration:InputDecoration(prefixIcon:const Icon(Icons.search),hintText:'ابحث بالاسم أو الهاتف أو الرقم التسلسلي...',filled:true,fillColor:Colors.white,border:OutlineInputBorder(borderRadius:BorderRadius.circular(14),borderSide:BorderSide.none)))),
      Expanded(child:data.when(loading:()=>const Center(child:CircularProgressIndicator()),error:(e,_)= > Center(child:Text('خطأ: $e')),data:(customers){final years=customers.map((c)=>c.archiveYear).whereType<int>().toSet().toList()..sort((a,b)=>b.compareTo(a)); final q=normalizeForSearch(query); final list=customers.where((c)=> (q.isEmpty||normalizeForSearch('${c.name} ${c.phone} ${c.serialNumber}').contains(q))&&(year==null||c.archiveYear==year)).toList(); return Column(children:[if(years.isNotEmpty)SizedBox(height:52,child:ListView(scrollDirection:Axis.horizontal,padding:const EdgeInsets.symmetric(horizontal:28,vertical:8),children:[ChoiceChip(label:const Text('كل السنوات'),selected:year==null,onSelected:(_)=>setState(()=>year=null)),...years.map((y)=>Padding(padding:const EdgeInsets.only(left:8),child:ChoiceChip(label:Text('$y'),selected:year==y,onSelected:(_)=>setState(()=>year=y))))])),Expanded(child:list.isEmpty?const Center(child:Text('لا توجد نتائج في الأرشيف')):ListView.builder(padding:const EdgeInsets.fromLTRB(28,8,28,24),itemCount:list.length,itemBuilder:(context,i)=>_Card(customer:list[i],admin:admin))) ]);}))
    ]));
  }
}
class _Card extends ConsumerWidget { final Customer customer; final bool admin; const _Card({required this.customer,required this.admin});
  @override Widget build(BuildContext context,WidgetRef ref){final orders=ref.watch(archivedOrdersProvider(customer.id)).value??[]; return Card(margin:const EdgeInsets.only(bottom:10),child:ExpansionTile(title:Text(customer.name,style:GoogleFonts.cairo(fontWeight:FontWeight.bold)),subtitle:Text('${customer.phone} • #${customer.serialNumber} • ${orders.length} طلب'),children:[...orders.map((o)=>ListTile(title:Text(o.itemType),subtitle:Text('التسليم ${DateFormat('d/M/yyyy').format(DateTime.fromMillisecondsSinceEpoch(o.deliveryDate))} • ${o.status}'),trailing:Text(o.totalAmount.toStringAsFixed(0))),),if(admin)Padding(padding:const EdgeInsets.all(12),child:FilledButton.icon(onPressed:()async{final e=await ref.read(repositoryProvider).reactivateCustomer(customer.id);if(context.mounted)ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text(e??'تم إعادة تنشيط العميل')));},icon:const Icon(Icons.unarchive_outlined),label:const Text('إعادة تنشيط العميل')))]));}
}
''', encoding='utf-8')

      - name: Fetch dependencies and regenerate Drift code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib .github/workflows/apply-customer-archive-desktop-v2.yml
          git diff --cached --quiet || git commit -m "Implement customer archive desktop"
          git push
