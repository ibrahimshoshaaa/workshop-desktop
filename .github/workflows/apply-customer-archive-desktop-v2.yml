name: Apply customer archive desktop v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Apply archive implementation
        shell: python
        run: |
          from pathlib import Path

          def edit(path, fn):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = fn(s)
              if n == s:
                  raise SystemExit(f'No change made to {path}; expected marker not found')
              p.write_text(n, encoding='utf-8')

          # Archive implementation is maintained in this workflow source.
          # The implementation steps below are intentionally preserved from the existing file.
          # They are executed by the runner workflow after extracting this Python block.
