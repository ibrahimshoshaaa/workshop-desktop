name: Apply WhatsApp invoice sharing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Implement Customer Archive') || contains(github.event.head_commit.message, 'chore: customize invoice PDF WhatsApp sharing')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch customer archive
        shell: python
        run: |
          from pathlib import Path

          def must_replace(path, old, new, count=1):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'Pattern not found: {path}: {old[:100]}')
              p.write_text(s.replace(old,new,count),encoding='utf-8')

          p=Path('lib/data/database.dart'); s=p.read_text(encoding='utf-8')
          s=s.replace("  BoolColumn get dirty => boolean().withDefault(const Constant(true))();\n\n  @override\n  Set<Column> get primaryKey => {id};\n}\n\n/// جدول الطلبات", "  BoolColumn get dirty => boolean().withDefault(const Constant(true))();\n  BoolColumn get isArchived => boolean().withDefault(const Constant(false))();\n  IntColumn get archivedAt => integer().nullable()();\n  IntColumn get archiveYear => integer().nullable()();\n\n  @override\n  Set<Column> get primaryKey => {id};\n}\n\n/// جدول الطلبات", 1)
          s=s.replace("  BoolColumn get dirty => boolean().withDefault(const Constant(true))();\n\n  @override\n  Set<Column> get primaryKey => {id};\n}\n\n/// جدول الدفعات", "  BoolColumn get dirty => boolean().withDefault(const Constant(true))();\n  BoolColumn get isArchived => boolean().withDefault(const Constant(false))();\n  IntColumn get archivedAt => integer().nullable()();\n  IntColumn get archiveYear => integer().nullable()();\n\n  @override\n  Set<Column> get primaryKey => {id};\n}\n\n/// جدول الدفعات", 1)
          s=s.replace("  int get schemaVersion => 10;", "  int get schemaVersion => 11;")
          old="""        if (from < 10) {
          // ربط مديونية الورشة بالطلب اللي ولّدها (نسخة 10) - لحالة العميل
          // اللي دفع أكتر من السعر النهائي بعد تعديله
          await m.addColumn(workshopDebts, workshopDebts.orderId);
        }"""
          new=old+"""
        if (from < 11) {
          // أرشيف العملاء والطلبات: السجلات لا تُحذف، فقط تُعلّم كمؤرشفة
          await m.addColumn(customers, customers.isArchived);
          await m.addColumn(customers, customers.archivedAt);
          await m.addColumn(customers, customers.archiveYear);
          await m.addColumn(orders, orders.isArchived);
          await m.addColumn(orders, orders.archivedAt);
          await m.addColumn(orders, orders.archiveYear);
        }"""
          must_replace('lib/data/database.dart',old,new)
          old="""  Stream<List<Customer>> watchCustomers() {
    return (select(customers)..where((t) => t.isDeleted.equals(false))).watch();
  }"""
          new="""  Stream<List<Customer>> watchCustomers() {
    return (select(customers)..where((t) => t.isDeleted.equals(false) & t.isArchived.equals(false))).watch();
  }

  Stream<List<Customer>> watchArchivedCustomers({int? year}) {
    final query = select(customers)..where((t) => t.isDeleted.equals(false) & t.isArchived.equals(true));
    if (year != null) query.where((t) => t.archiveYear.equals(year));
    return (query..orderBy([(t) => OrderingTerm.desc(t.archivedAt)])).watch();
  }

  Stream<List<Order>> watchArchivedOrders({int? year}) {
    final query = select(orders)..where((t) => t.isDeleted.equals(false) & t.isArchived.equals(true));
    if (year != null) query.where((t) => t.archiveYear.equals(year));
    return (query..orderBy([(t) => OrderingTerm.desc(t.archivedAt)])).watch();
  }

  Stream<List<Order>> watchArchivedOrdersForCustomer(String customerId) {
    return (select(orders)..where((t) => t.isDeleted.equals(false) & t.isArchived.equals(true) & t.customerId.equals(customerId))
          ..orderBy([(t) => OrderingTerm.desc(t.createdAt)]))
        .watch();
  }

  Future<String?> getCustomerArchiveBlockReason(String customerId) async {
    final rows = await (select(orders)..where((t) => t.customerId.equals(customerId) & t.isDeleted.equals(false))).get();
    if (rows.isEmpty) return null;
    if (rows.any((o) => o.remaining > 0)) return 'العميل عليه مبلغ متبقي';
    if (rows.any((o) => o.status != 'تم التسليم')) return 'يوجد طلب لم يتم تسليمه بعد';
    return null;
  }

  Future<bool> archiveCustomer(String customerId) async {
    final reason = await getCustomerArchiveBlockReason(customerId);
    if (reason != null) return false;
    final customer = await (select(customers)..where((t) => t.id.equals(customerId) & t.isDeleted.equals(false))).getSingleOrNull();
    if (customer == null || customer.isArchived) return false;
    final now = DateTime.now().millisecondsSinceEpoch;
    final year = DateTime.now().year;
    await transaction(() async {
      await (update(customers)..where((t) => t.id.equals(customerId))).write(CustomersCompanion(
        isArchived: const Value(true), archivedAt: Value(now), archiveYear: Value(year), updatedAt: Value(now), dirty: const Value(true),
      ));
      await (update(orders)..where((t) => t.customerId.equals(customerId) & t.isDeleted.equals(false))).write(OrdersCompanion(
        isArchived: const Value(true), archivedAt: Value(now), archiveYear: Value(year), updatedAt: Value(now), dirty: const Value(true),
      ));
    });
    return true;
  }"""
