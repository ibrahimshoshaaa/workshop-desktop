          new_block = r'''  Future<String?> _savePdfForWhatsApp(Uint8List bytes, String fileName) async {
    try {
      final dir = await getDownloadsDirectory() ?? await getApplicationDocumentsDirectory();
      final safeName = fileName.replaceAll(RegExp(r'[\\/:*?"<>|]'), '_');
      final file = File(p.join(dir.path, safeName));
      await file.writeAsBytes(bytes, flush: true);
      return file.path;
    } catch (_) { return null; }
  }

  Future<void> preview(BuildContext context, Uint8List bytes, String fileName) async {
    await Navigator.of(context).push(MaterialPageRoute(builder: (_) => Scaffold(
      appBar: AppBar(title: const Text('معاينة قبل التصدير'), backgroundColor: AppColors.wood, foregroundColor: Colors.white),
      body: PdfPreview(build: (format) async => bytes, pdfFileName: fileName, allowPrinting: true, allowSharing: false,
        actions: [IconButton(tooltip: 'مشاركة عبر واتساب', icon: const Icon(Icons.chat_rounded), onPressed: () async {
          final savedPath = await _savePdfForWhatsApp(bytes, fileName);
          final message = Uri.encodeComponent('فاتورة جاهزة: $fileName');
          var opened = await launchUrl(Uri.parse('whatsapp://send?text=$message'), mode: LaunchMode.externalApplication);
