name: Fix archive migration dirty state

on:
  push:
    paths:
      - 'lib/**'

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Fix archive migration dirty state')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix migration
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/data/database.dart')
          s = p.read_text(encoding='utf-8')
          old = """await (update(customers)..where((c) => c.isDeleted.equals(true)))\n              .write(const CustomersCompanion(isDeleted: Value(false), isArchived: Value(true)));\n          await (update(orders)..where((o) => o.isDeleted.equals(true)))\n              .write(const OrdersCompanion(isDeleted: Value(false), isArchived: Value(true)));"""
          new = """await (update(customers)..where((c) => c.isDeleted.equals(true)))\n              .write(const CustomersCompanion(isDeleted: Value(false), isArchived: Value(true), dirty: Value(true)));\n          await (update(orders)..where((o) => o.isDeleted.equals(true)))\n              .write(const OrdersCompanion(isDeleted: Value(false), isArchived: Value(true), dirty: Value(true)));"""
          if old not in s:
              raise SystemExit('migration pattern not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          Path('.github/workflows/fix-archive-migration-dirty.yml').unlink()
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib .github/workflows/fix-archive-migration-dirty.yml
          git commit -m 'Fix archive migration dirty state'
          git push
