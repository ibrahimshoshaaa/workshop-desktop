name: Customer archive desktop build

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_customer_archive.py'
      - '.github/workflows/customer-archive-desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true
      - name: Apply archive implementation
        run: python scripts/apply_customer_archive.py
      - name: Generate Drift and analyze
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter analyze
      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib
          git diff --cached --quiet || git commit -m "Implement professional customer archive on desktop"
          git push
